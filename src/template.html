<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <dialog id="todo-modal">
    <form id="todo-form">
      <h2>New Todo</h2>

      <label for="todo-title">Title</label>
      <input type="text" id="todo-title" required>

      <label for="todo-description">Description</label>
      <textarea id="todo-description"></textarea>

      <label for="todo-due-date">Due Date</label>
      <input type="date" id="todo-due-date">

      <label for="todo-priority">Priority</label>
      <select id="todo-priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <div class="dialog-buttons">
        <button type="submit">Add Todo</button>
        <button type="button" id="close-todo-dialog">Cancel</button>
      </div>
    </form>
  </dialog>

  <header>
    <p>Todo</p>
  </header>

  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-title home">
        <p>Home</p>
      </div>

      <nav class="sidebar-nav" id="nav-home">
        <ul>
          <li><button type="button" class="nav-btn" id="all-task">All Tasks</button></li>
          <li><button type="button" class="nav-btn" id="today-task">Today</button></li>
          <li><button type="button" class="nav-btn" id="sevenD-task">Next 7 Days</button></li>
        </ul>
      </nav>

      <div id="sidebar-title projects">
        <p>Projects</p>
      </div>

      <nav class="sidebar-nav" id="nav-projects">
        <ul>        
        </ul>
      </nav>

      <button id="add-project">Add Project</button>
    </aside>

    <main>
      <div id="section-title"></div>

      <div id="content"></div>

      <button id="add-todo-btn" aria-label="Add new todo">+</button>
    </main>

  </div>


  <footer>
    <p>Made by silc-o</p>
  </footer>
  
</body>
</html>
